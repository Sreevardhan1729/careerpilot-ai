name: daily-discovery
on:
  schedule:
    - cron: "30 2 * * *"        # 02:30 UTC = 08:00 Asia/Kolkata (spec §10.1)
  workflow_dispatch:
    inputs:
      date: { description: "Pipeline date YYYY-MM-DD (optional, for reruns)", required: false }
concurrency: { group: daily-discovery, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5      # pin to a commit SHA before relying on this in production
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev --no-group local
      - run: uv run python -m app.scheduler.daily --date "${{ inputs.date }}" --time-budget-minutes 100
        env:
          APP_ENV: production
          AUTH_MODE: supabase
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ALLOWED_USER_EMAILS: ${{ vars.ALLOWED_USER_EMAILS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'hashing' }}
          NVIDIA_EMBEDDING_MODEL: ${{ vars.NVIDIA_EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '1024' }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'none' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
          STORAGE_BACKEND: supabase
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TASK_RUNNER_ENABLED: "false"
